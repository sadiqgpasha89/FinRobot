[project]
name = "finrobot"
version = "0.1.0"
description = "Multi-agent equity research and valuation with LLMs"
requires-python = ">=3.11"
dependencies = [
  "httpx>=0.27",
  "psycopg[binary]>=3.2",
  "pgvector>=0.3",
  "minio>=7.2",
  "beautifulsoup4>=4.12",
  "lxml>=5",
  "pandas>=2.2",
  "numpy>=1.26",
  "matplotlib>=3.8",
  "jinja2>=3.1",
  "weasyprint>=62",
  "langgraph>=0.2",
  "fastapi>=0.110",
  "uvicorn>=0.29",
  "streamlit>=1.35",
  "pydantic>=2.6",
  "typer>=0.12",
  "python-dotenv>=1.0",
  "pyyaml>=6",
  "markdown>=3.5",
]

[dependency-groups]
dev = ["pytest>=8"]

[project.scripts]
finrobot = "finrobot.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/finrobot"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["integration: needs the docker compose stack (postgres, minio)", "live: needs Ollama and network access"]
addopts = "-m 'not integration and not live'"
