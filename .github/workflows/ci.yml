name: ci
on:
  push: {branches: [main]}
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint-and-unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with: {enable-cache: true}
      - run: uv lock --check
      - run: uv sync --frozen
      - run: uv run ruff check src tests evals
      - name: Unit tests (no network, no GPU, no database)
        run: uv run pytest

  integration:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:0.8.0-pg16
        env: {POSTGRES_PASSWORD: postgres}
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s --health-timeout 3s --health-retries 20
    env:
      FINROBOT_TEST_DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/postgres
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with: {enable-cache: true}
      - run: sudo apt-get update && sudo apt-get install -y --no-install-recommends libpango-1.0-0 libpangoft2-1.0-0 libharfbuzz0b fonts-dejavu-core
      - run: uv sync --frozen
      - name: Unit + integration tests with coverage (real Postgres + pgvector, LangGraph Postgres checkpointer, full graphs with a scripted model)
        run: uv run pytest -m "integration or not integration" --cov --cov-report=term-missing:skip-covered --cov-fail-under=80

  docker:
    runs-on: ubuntu-latest
    needs: [lint-and-unit]
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          load: true
          tags: finrobot:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Smoke test the image
        run: |
          docker run --rm finrobot:ci finrobot --help
          docker run --rm finrobot:ci python -c "from finrobot.report.render import to_pdf; pdf, pages = to_pdf('<h1>ok</h1>'); assert pdf.startswith(b'%PDF')"
          docker run --rm -e FINROBOT_ENV=production finrobot:ci python -c "from finrobot.config import settings; assert settings.production_problems()"   # refuses dev defaults
